name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: differential / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      CORPUS: fuzz/corpus/differential
      ARTIFACT: fuzz-corpus-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Corpus from the last run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$CORPUS"
          runs=$(gh run list --workflow fuzz.yml --branch main --status completed \
            --limit 10 --json databaseId --jq '.[].databaseId' || true)
          for run in $runs; do
            if gh run download "$run" --name "$ARTIFACT" --dir "$CORPUS"; then
              echo "Starting from run $run"
              break
            fi
          done
          echo "$(find "$CORPUS" -type f | wc -l) inputs"
      - name: Build
        id: build
        run: cargo fuzz build differential --target ${{ matrix.target }}
      - name: Differential against upstream
        run: cargo fuzz run differential --target ${{ matrix.target }} -- -max_total_time=2700 -max_len=8192
      - name: Minimize the corpus
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo fuzz cmin differential --target ${{ matrix.target }} -- -max_len=8192
          echo "$(find "$CORPUS" -type f | wc -l) inputs"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.CORPUS }}
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
