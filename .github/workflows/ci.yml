name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.target }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rust: stable }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rust: beta }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rust: nightly }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, rust: stable, block: armv8, ubc_check: neon }
          - { os: macos-latest, target: aarch64-apple-darwin, rust: stable, block: armv8, ubc_check: neon }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rust: stable }
          - { os: windows-latest, target: i686-pc-windows-msvc, rust: stable }
          - { os: windows-latest, target: x86_64-pc-windows-gnu, rust: stable }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, rust: stable, block: armv8, ubc_check: neon }
    env:
      SHA1DC_EXPECT_BLOCK: ${{ matrix.block }}
      SHA1DC_EXPECT_UBC_CHECK: ${{ matrix.ubc_check }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sha1dc --all-targets --target ${{ matrix.target }}
      - run: cargo test -p sha1dc --all-features --target ${{ matrix.target }}
      - run: cargo check -p sha1dc --no-default-features --all-targets --target ${{ matrix.target }}

  checks:
    name: fmt, clippy, docs, codegen, msrv, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Generated code is current
        run: cargo run -p sha1dc-codegen -- --check
      - name: Generator tests
        run: cargo test --workspace --exclude sha1dc --all-features
      - name: Minimum supported Rust version
        run: cargo +1.87.0 check --lib --all-features
      - name: Package
        run: cargo package

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            riscv64gc-unknown-linux-gnu, powerpc-unknown-linux-gnu, arm64ec-pc-windows-msvc,
            thumbv7em-none-eabi, thumbv6m-none-eabi, wasm32-unknown-unknown,
            aarch64-unknown-none-softfloat, x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --all-features --target riscv64gc-unknown-linux-gnu
      - run: cargo check --lib --all-features --target powerpc-unknown-linux-gnu
      - run: cargo check --lib --all-features --target arm64ec-pc-windows-msvc
      - run: cargo check --lib --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --lib --no-default-features --target thumbv6m-none-eabi
      - run: cargo check --lib --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --lib --no-default-features --target aarch64-unknown-none-softfloat
      - run: cargo check --lib --no-default-features --target x86_64-unknown-none

  emulated:
    name: emulated / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The guest runs on the libraries under `sysroot`, never the runner's
      # own. The runner image installs Ubuntu's amd64v3 packages, whose glibc
      # assumes AVX2, so running it under a `cpu` without AVX2 (Nehalem,
      # Denverton) dies of SIGILL before a test starts. The *-cross packages
      # are built for the baseline of their architecture.
      #
      # `-L` alone is not enough: QEMU serves the guest a path from `sysroot`
      # only when it exists there and otherwise quietly hands it the host's.
      # The guest's loader reads the host's /etc/ld.so.cache, which names
      # /usr/lib/<triple>/libc.so.6, a path the cross packages do not have, so
      # libc came from the host. `-E LD_LIBRARY_PATH=/lib` makes the loader
      # look in /lib first, which `-L` maps into `sysroot`. `loader` is the
      # program interpreter, used to check where every library resolves.
      matrix:
        include:
          - { name: s390x big-endian, target: s390x-unknown-linux-gnu, qemu: qemu-s390x, cpu: max, block: scalar, ubc_check: scalar, sysroot: /usr/s390x-linux-gnu, loader: lib/ld64.so.1, deps: gcc-s390x-linux-gnu }
          - { name: i686, target: i686-unknown-linux-gnu, qemu: qemu-i386, cpu: max, block: sha-ni, ubc_check: avx2, sysroot: /usr/i686-linux-gnu, loader: lib/ld-linux.so.2, deps: gcc-multilib libc6-i386-cross libgcc-s1-i386-cross }
          - { name: i586, target: i586-unknown-linux-gnu, qemu: qemu-i386, cpu: max, block: sha-ni, ubc_check: scalar, sysroot: /usr/i686-linux-gnu, loader: lib/ld-linux.so.2, deps: gcc-multilib libc6-i386-cross libgcc-s1-i386-cross }
          - { name: x86_64 sse2, target: x86_64-unknown-linux-gnu, qemu: qemu-x86_64, cpu: Nehalem, block: sse2, ubc_check: sse2, sysroot: /usr/x86_64-linux-gnu, loader: lib64/ld-linux-x86-64.so.2, deps: libc6-amd64-cross libgcc-s1-amd64-cross }
          - { name: x86_64 atom, target: x86_64-unknown-linux-gnu, qemu: qemu-x86_64, cpu: Denverton, block: sha-ni, ubc_check: sse2, sysroot: /usr/x86_64-linux-gnu, loader: lib64/ld-linux-x86-64.so.2, deps: libc6-amd64-cross libgcc-s1-amd64-cross }
    env:
      QEMU_RUN: ${{ matrix.qemu }} -cpu ${{ matrix.cpu }} -L ${{ matrix.sysroot }} -E LD_LIBRARY_PATH=/lib
      CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU and the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.deps }}
      - name: Check that the guest's libraries come from the sysroot
        run: |
          bin=$(cargo test -p sha1dc --all-features --target ${{ matrix.target }} --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | head -n 1)
          libs=$($QEMU_RUN "${{ matrix.sysroot }}/${{ matrix.loader }}" --list "$bin")
          echo "$libs"
          for path in $(echo "$libs" | awk '$2 == "=>" { print $3 }'); do
            case "$path" in
              ${{ matrix.sysroot }}/*) ;;
              *) if [ ! -e "${{ matrix.sysroot }}$path" ]; then
                   echo "::error::$path resolves outside ${{ matrix.sysroot }}, so QEMU hands the guest the host's copy"
                   exit 1
                 fi ;;
            esac
          done
      - name: Test
        env:
          SHA1DC_EXPECT_BLOCK: ${{ matrix.block }}
          SHA1DC_EXPECT_UBC_CHECK: ${{ matrix.ubc_check }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.QEMU_RUN }}
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.QEMU_RUN }}
          CARGO_TARGET_I586_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.QEMU_RUN }}
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.QEMU_RUN }}
        run: cargo test -p sha1dc --all-features --target ${{ matrix.target }}

  wasm:
    name: wasm32-wasip1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Test
        env:
          SHA1DC_EXPECT_BLOCK: scalar
          SHA1DC_EXPECT_UBC_CHECK: scalar
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}::${{ github.workspace }}
        run: cargo test -p sha1dc --all-features --target wasm32-wasip1

  fuzz:
    name: fuzz / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Differential against upstream
        run: cargo fuzz run differential --target ${{ matrix.target }} -- -max_total_time=120 -max_len=8192
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [test, checks, cross, emulated, wasm, fuzz]
    if: always()
    steps:
      - name: Check that all jobs succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
