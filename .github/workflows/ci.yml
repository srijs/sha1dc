name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: stable }
          - { os: ubuntu-24.04-arm, rust: stable, block: armv8, ubc_check: neon }
          - { os: macos-latest, rust: stable, block: armv8, ubc_check: neon }
          - { os: windows-latest, rust: stable }
          - { os: ubuntu-latest, rust: beta }
          - { os: ubuntu-latest, rust: nightly }
    env:
      SHA1DC_EXPECT_BLOCK: ${{ matrix.block }}
      SHA1DC_EXPECT_UBC_CHECK: ${{ matrix.ubc_check }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-features
      - run: cargo check --no-default-features --all-targets

  checks:
    name: fmt, clippy, docs, codegen, msrv, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.87.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Generated code is current
        run: cargo run -p sha1dc-codegen -- --check
      - name: Minimum supported Rust version
        run: cargo +1.87.0 check --lib --all-features
      - name: Package
        run: cargo package

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu, thumbv7em-none-eabi, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --all-features --target riscv64gc-unknown-linux-gnu
      - run: cargo check --lib --no-default-features --target thumbv7em-none-eabi
      - run: cargo check --lib --no-default-features --target wasm32-unknown-unknown

  emulated:
    name: emulated / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: s390x big-endian, target: s390x-unknown-linux-gnu, cpu: max, block: scalar, ubc_check: scalar, deps: gcc-s390x-linux-gnu }
          - { name: i686, target: i686-unknown-linux-gnu, cpu: max, block: sha-ni, ubc_check: avx2, deps: gcc-multilib }
          - { name: i586, target: i586-unknown-linux-gnu, cpu: max, block: sha-ni, ubc_check: scalar, deps: gcc-multilib }
          - { name: x86_64 sse2, target: x86_64-unknown-linux-gnu, cpu: Nehalem, block: scalar, ubc_check: sse2 }
          - { name: x86_64 atom, target: x86_64-unknown-linux-gnu, cpu: Denverton, block: sha-ni, ubc_check: sse2 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU and the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user ${{ matrix.deps }}
      - name: Test
        env:
          SHA1DC_EXPECT_BLOCK: ${{ matrix.block }}
          SHA1DC_EXPECT_UBC_CHECK: ${{ matrix.ubc_check }}
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: qemu-x86_64 -cpu ${{ matrix.cpu }}
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUNNER: qemu-i386 -cpu ${{ matrix.cpu }} -L /usr/i686-linux-gnu
          CARGO_TARGET_I586_UNKNOWN_LINUX_GNU_RUNNER: qemu-i386 -cpu ${{ matrix.cpu }} -L /usr/i686-linux-gnu
          CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_RUNNER: qemu-s390x -cpu ${{ matrix.cpu }} -L /usr/s390x-linux-gnu
        run: cargo test -p sha1dc --all-features --target ${{ matrix.target }}

  success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [test, checks, cross, emulated]
    if: always()
    steps:
      - name: Check that all jobs succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
