[package]
name = "sha1dc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha1 = "0.11"
sha1dc = { path = ".." }

[build-dependencies]
cc = "1"

# Its own workspace, which the root one would otherwise claim.
[workspace]

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false
